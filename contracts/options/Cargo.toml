[package]
name = "zenith-options"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "23.0.0"

[dev-dependencies]
soroban-sdk = { version = "23.0.0", features = ["testutils"] }

# `cfg(kani)` is defined by the Kani verifier (see src/kani_proofs.rs); declare
# it here so rustc's check-cfg lint accepts it in normal builds too.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace]

# Kani harnesses (src/kani_proofs.rs) are compiled only under `cargo kani`.
[package.metadata.kani]
flags = ["--enable-unstable"]
